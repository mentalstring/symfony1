name: "Continuous Integration"

on:
  push:
    branches:
      - master
  pull_request:

env:
  fail-fast: true

jobs:
  tests:
    name: "Symfony1 Tests"
    runs-on: "ubuntu-latest"

    strategy:
      matrix:
        php-version:
          - "7.4"
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
        memcached-version:
          - "1.6"

    services:
      memcached:
        image: "memcached:${{ matrix.memcached-version }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "true"

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php-version }}"
          ini-file: development
          extensions: apcu
          ini-values: apc.enable_cli=1

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist

      - name: Run Check configuration
        run: php data/bin/check_configuration.php

      - name: Run Tests
        run: |
          ini_dir=$(mktemp -d "$RUNNER_TEMP/symfony-php-ini.XXXXXX")
          log="$RUNNER_TEMP/symfony-php-errors.log"
          : > "$log"
          printf 'error_reporting=E_ALL\nlog_errors=On\nerror_log="%s"\n' "$log" > "$ini_dir/99-symfony-tests.ini"
          # Lime's PHP subprocesses inherit the scan path along with the regular INI settings.
          PHP_INI_SCAN_DIR="${PHP_INI_SCAN_DIR-}:$ini_dir" php data/bin/symfony symfony:test --trace

      - name: Report PHP diagnostics
        id: php-diagnostics
        if: ${{ !cancelled() }}
        run: |
          if [ -s "$RUNNER_TEMP/symfony-php-errors.log" ]; then
            echo 'has-diagnostics=true' >> "$GITHUB_OUTPUT"
            echo '::warning title=PHP ${{ matrix.php-version }} test diagnostics::The framework test suite logged PHP diagnostics. Expand the PHP diagnostics group in this step.'
            echo '::group::PHP ${{ matrix.php-version }} diagnostics'
            token="php-diagnostics-$(date +%s%N)"
            echo "::stop-commands::$token"
            cat "$RUNNER_TEMP/symfony-php-errors.log"
            echo "::$token::"
            echo '::endgroup::'
          fi

      - name: Upload PHP diagnostics
        if: ${{ !cancelled() && steps.php-diagnostics.outputs.has-diagnostics == 'true' }}
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: php-diagnostics-${{ matrix.php-version }}-memcached-${{ matrix.memcached-version }}
          path: ${{ runner.temp }}/symfony-php-errors.log
